name: Bug report
description: Report a reproducible problem in DeepSeek Harness Desktop Gala
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project. Remove credentials, API keys, private paths and sensitive logs before submitting.
  - type: input
    id: version
    attributes:
      label: App version
      description: For example, 2.1.0-preview.2
      placeholder: 2.1.0-preview.2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS Apple Silicon
        - Windows 11 x64
        - Windows 10 x64
        - Running from source
        - Other / unsupported
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Screenshots or diagnostics
      description: Attach only material you have reviewed for private data. Never paste an API key.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing Issues for the same problem.
          required: true
        - label: I removed credentials and other sensitive information.
          required: true
