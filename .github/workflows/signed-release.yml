name: Publish Signed Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          architecture: x64
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Verify stable tag and package version
        run: node -e "const p=require('./package.json'); if (p.version.includes('-') || 'v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('stable tag/package version mismatch')"
      - run: corepack yarn workspace dsh-plugin-gala build
      - run: corepack yarn workspace dsh-plugin-desktop check:win-package
      - name: Build signed Windows application and NSIS installer
        working-directory: dsh-plugin-desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: >-
          corepack yarn exec electron-builder --win nsis --x64 --publish never
          --config.forceCodeSigning=true
          --config.npmRebuild=false
          --config.extraMetadata.desktopUpdateMode=signed-auto
      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $paths = @(
            'dsh-plugin-desktop/dist/win-unpacked/DeepSeek Harness Desktop Gala.exe',
            (Get-ChildItem 'dsh-plugin-desktop/dist/DeepSeek-Harness-Desktop-Gala-*-x64-Setup.exe' | Select-Object -First 1).FullName
          )
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $path ($($signature.Status))" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: |
            dsh-plugin-desktop/dist/DeepSeek-Harness-Desktop-Gala-*-x64-Setup.exe
            dsh-plugin-desktop/dist/DeepSeek-Harness-Desktop-Gala-*-x64-Setup.exe.blockmap
            dsh-plugin-desktop/dist/latest.yml
          if-no-files-found: error

  macos:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Verify stable tag and package version
        run: node -e "const p=require('./package.json'); if (p.version.includes('-') || 'v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('stable tag/package version mismatch')"
      - name: Build, sign, notarize and staple macOS artifacts
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: corepack yarn dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-signed
          path: |
            dsh-plugin-desktop/dist/DeepSeek-Harness-Desktop-Gala-*-arm64.dmg
            dsh-plugin-desktop/dist/DeepSeek-Harness-Desktop-Gala-*-arm64.dmg.blockmap
            dsh-plugin-desktop/dist/DeepSeek-Harness-Desktop-Gala-*-arm64.zip
            dsh-plugin-desktop/dist/DeepSeek-Harness-Desktop-Gala-*-arm64.zip.blockmap
            dsh-plugin-desktop/dist/latest-mac.yml
          if-no-files-found: error

  release:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' \
            'Signed DeepSeek Harness Desktop Gala release for Windows x64 and Apple Silicon macOS.' \
            '' \
            'Updates are downloaded only after confirmation and installed only after a second confirmation.' \
            > release-notes.md
          gh release create "$TAG" artifacts/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "DeepSeek Harness Desktop Gala ${TAG#v}" \
            --notes-file release-notes.md
