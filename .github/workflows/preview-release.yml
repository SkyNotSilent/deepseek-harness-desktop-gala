name: Publish Preview

on:
  push:
    tags:
      - 'v*-preview.*'

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          architecture: x64
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('tag/package version mismatch')"
      - run: corepack yarn workspace dsh-plugin-gala build
      - run: corepack yarn dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dsh-plugin-desktop/dist/DeepSeek-Harness-Desktop-Gala-*-x64-Setup.exe
          if-no-files-found: error
          retention-days: 1

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('tag/package version mismatch')"
      - run: corepack yarn build
      - name: Build unsigned artifacts
        working-directory: dsh-plugin-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: corepack yarn exec electron-builder --mac dmg zip --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dsh-plugin-desktop/dist/DeepSeek-Harness-Desktop-Gala-*-arm64.dmg
            dsh-plugin-desktop/dist/DeepSeek-Harness-Desktop-Gala-*-arm64.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "DeepSeek Harness Desktop Gala ${TAG#v}" \
            --notes-file "docs/releases/${TAG}.md"
